<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Full-Page Iframe</title>
  <style>
    /* Make html/body fill the viewport and remove all spacing */
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
    }

    /* Full-screen iframe */
    #sitePreview {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;   /* or 100% */
      height: 100vh;  /* or 100% */
      border: none;   /* remove default border */
    }
  </style>
</head>
<body>
  <iframe
    id="sitePreview"
    title="Website preview"
    srcdoc="<!doctype html><html><head><meta charset='utf-8'><style>html,body{height:100%;margin:0;background:#111318;color:#aab2c0;display:grid;place-items:center;font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}</style></head><body><div>Preview will appear here</div></body></html>"
  ></iframe>

  <script
    src="https://cdnjs.cloudflare.com/ajax/libs/axios/0.21.1/axios.min.js"
    integrity="sha512-bZS47S7sPOxkjU/4Bt0zrhEtWx0y0CRkhEp8IckzK+ltifIIE9EMIMTuT/mEzoIMewUINruDBIR/jJnbguonqQ=="
    crossorigin="anonymous"
    referrerpolicy="no-referrer"
  ></script>
  <script src="scripts/fullPreview.js" defer></script>
</body>
</html>
