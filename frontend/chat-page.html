<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AI Cofounder Chat</title>
  <link rel="stylesheet" href="styles/chat-page.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet"/>

  <script type="importmap">
  {
    "imports": {
      "marked": "https://cdn.jsdelivr.net/npm/marked@4.3.0/lib/marked.esm.js"
    }
  }
  </script>

</head>
<body>
  <div id="sidebar-placeholder"></div>
  <main class="container">
    <header class="chat-hero">
      <h1 class="headline">
        <span class="gradient-text">Chat with Your AI CoFounder</span>
      </h1>
    </header>

    <section class="thread-shell">
      <div
        class="chat-window js-chat-window"
        data-empty-title="Ask about your startup idea"
        data-empty-subtitle="Strategy, validation, product decisions, GTM, and next steps"
      ></div>
    </section>

    <section class="composer-shell">
      <div class="chat-input-area">
        <input
          type="text"
          class="chat-input"
          placeholder="Ask anything about your startup idea..."
        />
        <button class="send-btn js-send" aria-label="Send message">➤</button>
        <button class="stop-btn js-stop" title="Stop generating" aria-label="Stop generating">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="currentColor">
            <rect width="14" height="14" rx="2"/>
          </svg>
        </button>
      </div>

      <div class="quick-actions">
        <span class="quick-actions-label">Tools</span>
        <button class="action-quick-btn quick-btn" data-action="email" title="Send Email">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
            <polyline points="22,6 12,13 2,6"/>
          </svg>
          Email
        </button>
        <button class="action-quick-btn quick-btn" data-action="calendar" title="Schedule Event">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
            <line x1="16" y1="2" x2="16" y2="6"/>
            <line x1="8" y1="2" x2="8" y2="6"/>
            <line x1="3" y1="10" x2="21" y2="10"/>
          </svg>
          Calendar
        </button>
        <button class="action-quick-btn quick-btn" data-action="slides" title="Create Slides">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="2" y="3" width="20" height="14" rx="2" ry="2"/>
            <line x1="8" y1="21" x2="16" y2="21"/>
            <line x1="12" y1="17" x2="12" y2="21"/>
          </svg>
          Slides
        </button>
        <button class="action-quick-btn quick-btn" data-action="sheets" title="Create Spreadsheet">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
            <line x1="3" y1="9" x2="21" y2="9"/>
            <line x1="3" y1="15" x2="21" y2="15"/>
            <line x1="9" y1="3" x2="9" y2="21"/>
          </svg>
          Sheets
        </button>
        <button class="action-quick-btn quick-btn" data-action="forms" title="Create Form">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M9 11l3 3L22 4"/>
            <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>
          </svg>
          Forms
        </button>
        <button class="action-quick-btn quick-btn" data-action="content" title="Generate Content">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 20h9"/>
            <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/>
          </svg>
          Content
        </button>
      </div>
    </section>
  </main>
<!-- auth-guard.html (inline or put in scripts/auth-guard.js and <script src> it) -->
<script>
(function () {
  const LOGIN_URL = '/auth.html';

  // If you're already on auth.html, do nothing
  if (location.pathname.endsWith('/auth.html')) return;

  const token = localStorage.getItem('accessToken');
  if (!token) {
    // Not logged in (no token) → redirect
    return location.replace(LOGIN_URL);
  }

  // Optionally: verify expiry client-side with jwt-decode or
  // ping a /token/verify endpoint. Otherwise, just let the
  // axios interceptor handle 401s server-side.
})();
</script>

  <script
    src="https://cdnjs.cloudflare.com/ajax/libs/axios/0.21.1/axios.min.js"
    integrity="sha512-bZS47S7sPOxkjU/4Bt0zrhEtWx0y0CRkhEp8IckzK+ltifIIE9EMIMTuT/mEzoIMewUINruDBIR/jJnbguonqQ=="
    crossorigin="anonymous"
    referrerpolicy="no-referrer"
  ></script>
  <script src="./scripts/apiLimitHandler.js"></script>
  <script src="./scripts/subscriptionHandler.js"></script>
  <script type="module" src="./scripts/chat.js"></script>
  <script type="module">
  async function loadSidebar() {
    const res  = await fetch('sidebar.html');
    const html = await res.text();
    document.getElementById('sidebar-placeholder').innerHTML = html;

    const { initSidebar } = await import('./scripts/sidebar.js');
    await initSidebar();
  }
  loadSidebar();
</script>


<script>
(() => {
  const input = document.querySelector('.chat-input');
  if (!input) return;

  // Don't animate if the user already typed something
  if (input.value) return;

  const PREFIX   = 'Ask about ';
  const SUFFIXES = [
    'features',
    'strategy',
    'implementation',
    'developing your idea',
    'improving your scores',
    'the correct tech stack',
    'your first step'
  ];

  const TYPE_MS   = 45;   // typing speed
  const ERASE_MS  = 35;   // deleting speed
  const HOLD_MS   = 1100; // pause after finishing a suffix
  const GAP_MS    = 300;  // pause before starting the next suffix

  let stopped = false;
  let suffixIndex = 0;

  // Stop the effect if user engages
  function stop() { stopped = true; }
  input.addEventListener('focus', stop);
  input.addEventListener('input', stop);

  // Helper: type a string into placeholder
  function typeToPlaceholder(fullText, startLen, endLen, step, delay, done) {
    let i = startLen;
    function tick() {
      if (stopped) return;
      input.placeholder = fullText.slice(0, i);
      if ((step > 0 && i < endLen) || (step < 0 && i > endLen)) {
        i += step;
        setTimeout(tick, delay);
      } else {
        done && done();
      }
    }
    tick();
  }

  // 1) Type the static prefix once
  function typePrefixThenCycle() {
    input.placeholder = '';
    typeToPlaceholder(PREFIX, 0, PREFIX.length, +1, TYPE_MS, () => {
      cycleSuffixes();
    });
  }

  // 2) Type current suffix, hold, then erase just the suffix, move to next
  function cycleSuffixes() {
    if (stopped) return;
    const suffix = SUFFIXES[suffixIndex];
    const full   = PREFIX + suffix;

    // Type the suffix after the already-typed prefix
    typeToPlaceholder(full, PREFIX.length, full.length, +1, TYPE_MS, () => {
      if (stopped) return;
      setTimeout(() => {
        // Delete only the suffix back to the prefix
        typeToPlaceholder(full, full.length, PREFIX.length, -1, ERASE_MS, () => {
          if (stopped) return;
          suffixIndex = (suffixIndex + 1) % SUFFIXES.length;
          setTimeout(cycleSuffixes, GAP_MS);
        });
      }, HOLD_MS);
    });
  }

  // small delay so the page feels settled
  setTimeout(typePrefixThenCycle, 250);
})();
</script>

</body>
</html>
