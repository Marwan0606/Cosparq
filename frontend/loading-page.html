<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CoSparq — Thinking…</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet"/>
  <style>
    :root{
      --bg:#0f0f10; --panel:#17181b; --text:#e8e8ea; --muted:#a5a7ae;
      /* Theme gradient only (no rainbow animation) */
      --grad: linear-gradient(90deg,#8400ff 0%,#f94016 40%,#f96d16 60%,#3b82f6 100%);
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0; font-family:Inter,system-ui,Segoe UI,Roboto,sans-serif;
      background:#121212; color:var(--text);
      display:flex; align-items:center; justify-content:center; padding:24px;
    }

    /* Frame */
    .frame{
      width:min(920px,90vw); height:min(70vh,640px);
      background:#0f0f10; position:relative; border-radius:14px; overflow:hidden;
    }
    .frame::before{
      content:""; position:absolute; inset:0; padding:2px; border-radius:14px;
      background:var(--grad);
      -webkit-mask:
        linear-gradient(#000 0 0) content-box,
        linear-gradient(#000 0 0);
      -webkit-mask-composite:xor; mask-composite:exclude;
      /* NOTE: no hue-rotate/animation here — stays on theme colors */
    }

    /* Brand + Subline */
    .brand-wrap{
      position:absolute; left:50%; transform:translateX(-50%);
      top:16px; display:flex; flex-direction:column; align-items:center; gap:14px;
      white-space: nowrap;
    }
    .brand{
      padding:30px 18px; border-radius:8px; background:#0d0e10;
      font-weight:800; font-size:46px; line-height:1;
      background-image:var(--grad);
      -webkit-background-clip:text; background-clip:text; color:transparent;
      letter-spacing:.3px;
    }

    .new{
      padding: 0px 18px; border-radius:8px; background:#0d0e10;
      font-weight:800; font-size:46px; line-height:1;
      background-image:var(--grad);
      -webkit-background-clip:text; background-clip:text; color:transparent;
      letter-spacing:.3px;
      margin-top: -20px;
    }

    .subline{
      font-size:16px; font-weight:600;
      opacity:.98; letter-spacing:.02em;
    }
    .dotting::after{
      content:'…';
      animation:dots 1.2s steps(4,end) infinite;
    }
    @keyframes dots{
      0%,20%{content:''}
      40%{content:'.'}
      60%{content:'..'}
      80%,100%{content:'...'}
    }

    /* Viz */
    .viz{
      /* a little more gap below the subline */
      position:absolute; inset:140px 24px 24px;
      display:grid; place-items:center;
      margin-top: -50px;
    }
    /* Larger network than last version */
    svg{ width:100%; max-width:780px; height:100%; max-height:500px }

    /* Graph styles */
    .link{
      stroke:#2c2c2c; stroke-width:1.5; opacity:.9;
    }
    .node{
      fill:#2f3034;
      transform-box: fill-box;
      transform-origin: center;
      will-change: transform;
    }
    .node.center{ fill:#444 }

    /* Glow animations (calm) */
    .link.glow{ animation: linkPulse 1100ms cubic-bezier(0.22,1,0.36,1); }
    .node.glow{ animation: nodePop   900ms  cubic-bezier(0.22,1,0.36,1); }

    @keyframes linkPulse{
      0%   { stroke:#2c2c2c; stroke-width:1.5; opacity:.65 }
      30%  { stroke:url(#g);  stroke-width:2.05; opacity:.9 }
      60%  { stroke:url(#g);  stroke-width:2.05; opacity:.9 }
      100% { stroke:#2c2c2c; stroke-width:1.5; opacity:.85 }
    }
    @keyframes nodePop{
      0%   { transform:scale(1);    fill:#2f3034; filter:none; opacity:.7 }
      30%  { transform:scale(1.06); fill:#eaeaea; filter:drop-shadow(0 0 6px rgba(249,64,22,.25)); opacity:.95 }
      70%  { transform:scale(1.06); fill:#eaeaea; filter:drop-shadow(0 0 6px rgba(249,64,22,.25)); opacity:.95 }
      100% { transform:scale(1);    fill:#2f3034; filter:none; opacity:.9 }
    }

    /* Bottom-right status */
    .status{
      position:absolute; right:16px; bottom:14px; font-size:.95rem; color:#a5a7ae;
    }

    /* Reduced motion */
    @media (prefers-reduced-motion: reduce){
      .link.glow,.node.glow{ animation-duration: 400ms; }
      .dotting::after{ animation:none; content:'...' }
    }
  </style>
</head>
<body>
  <div class="frame">
    <div class="brand-wrap">
      <div class="brand">Your AI is working hard</div>
      <!--<div class="new dotting"></div>-->
    </div>

    <div class="viz">
      <svg viewBox="0 0 800 520" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <defs>
          <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%"  stop-color="#8400ff"/>
            <stop offset="40%" stop-color="#f94016"/>
            <stop offset="60%" stop-color="#f96d16"/>
            <stop offset="100%" stop-color="#3b82f6"/>
          </linearGradient>
        </defs>

        <!-- Links -->
        <g id="links">
          <line class="link" data-a="n1"  data-b="n5" x1="130" y1="90"  x2="320" y2="130"/>
          <line class="link" data-a="n5"  data-b="n6" x1="320" y1="130" x2="410" y2="90"/>
          <line class="link" data-a="n6"  data-b="c"  x1="410" y1="90"  x2="400" y2="260"/>
          <line class="link" data-a="n2"  data-b="n5" x1="120" y1="250" x2="320" y2="130"/>
          <line class="link" data-a="n2"  data-b="c"  x1="120" y1="250" x2="400" y2="260"/>
          <line class="link" data-a="n3"  data-b="c"  x1="160" y1="400" x2="400" y2="260"/>
          <line class="link" data-a="n4"  data-b="c"  x1="300" y1="460" x2="400" y2="260"/>
          <line class="link" data-a="n7"  data-b="c"  x1="650" y1="110" x2="400" y2="260"/>
          <line class="link" data-a="n7"  data-b="n8" x1="650" y1="110" x2="720" y2="240"/>
          <line class="link" data-a="n8"  data-b="n9" x1="720" y1="240" x2="620" y2="370"/>
          <line class="link" data-a="n9"  data-b="c"  x1="620" y1="370" x2="400" y2="260"/>
          <line class="link" data-a="n10" data-b="c"  x1="470" y1="470" x2="400" y2="260"/>
        </g>

        <!-- Nodes -->
        <g id="nodes">
          <circle id="n1"  class="node" cx="130" cy="90"  r="7"/>
          <circle id="n2"  class="node" cx="120" cy="250" r="7"/>
          <circle id="n3"  class="node" cx="160" cy="400" r="7"/>
          <circle id="n4"  class="node" cx="300" cy="460" r="7"/>
          <circle id="n5"  class="node" cx="320" cy="130" r="7"/>
          <circle id="n6"  class="node" cx="410" cy="90"  r="7"/>
          <circle id="n7"  class="node" cx="650" cy="110" r="7"/>
          <circle id="n8"  class="node" cx="720" cy="240" r="7"/>
          <circle id="n9"  class="node" cx="620" cy="370" r="7"/>
          <circle id="n10" class="node" cx="470" cy="470" r="7"/>
          <circle id="c"   class="node center" cx="400" cy="260" r="9"/>
        </g>
      </svg>
    </div>

    <!-- Bottom-right status -->
    <div class="status dotting">Loading</div>
  </div>

  <script src="scripts/loading.js"></script>
</body>
</html>
