<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Your AI Cofounder — Action Plan</title>
  <link rel="stylesheet" href="styles/action-page.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet"/>
</head>
<body>
  <div id="sidebar-placeholder"></div>
  <div class="container">

    <!-- Title & Subtitle -->
    <h1 class="headline">
      <span class="gradient-text">Your Startup Action Plan</span>
    </h1>
    <p class="subtitle">
      A comprehensive roadmap to turn your idea into a successful business
    </p>

    <div class="js-grid">



    </div>
    <!-- Concept Card -->
    
  </div>
  <div id="tooltip" class="tooltip"></div>
<script>
(function () {
  const LOGIN_URL = '/auth.html';

  // If you're already on auth.html, do nothing
  if (location.pathname.endsWith('/auth.html')) return;

  const token = localStorage.getItem('accessToken');
  if (!token) {
    // Not logged in (no token) → redirect
    return location.replace(LOGIN_URL);
  }

  // Optionally: verify expiry client-side with jwt-decode or
  // ping a /token/verify endpoint. Otherwise, just let the
  // axios interceptor handle 401s server-side.
})();
</script>

  <script
    src="https://cdnjs.cloudflare.com/ajax/libs/axios/0.21.1/axios.min.js"
    integrity="sha512-bZS47S7sPOxkjU/4Bt0zrhEtWx0y0CRkhEp8IckzK+ltifIIE9EMIMTuT/mEzoIMewUINruDBIR/jJnbguonqQ=="
    crossorigin="anonymous"
    referrerpolicy="no-referrer"
  ></script>
  <script src="./scripts/apiLimitHandler.js"></script>
  <script type="module" src="scripts/actionPlan.js"></script>
  <script type="module" src="./scripts/loading.js"></script>
  <script type="module">
  async function loadSidebar() {
    const res  = await fetch('sidebar.html');
    const html = await res.text();
    document.getElementById('sidebar-placeholder').innerHTML = html;

    const { initSidebar } = await import('./scripts/sidebar.js');
    await initSidebar();
  }
  loadSidebar();
</script>

</body>
</html>
