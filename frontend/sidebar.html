<style>
  :root{
    --bg:#0f0f10; --panel:#191a1d; --text:#e8e8ea; --muted:#a5a7ae;
    --border: rgba(255,255,255,0.06); --radius:14px; --shadow:0 10px 30px rgba(0,0,0,.35);
    --grad: linear-gradient(90deg,#8400ff 0%,#f94016 40%,#f96d16 60%,#3b82f6 100%);
    font-family:'Inter',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  }
  *{box-sizing:border-box}
  html {color:var(--text)}

  /* Sidebar */
  .sidebar{
    position: fixed;
    top: 0; left: 0;
    width: 220px;
    height: 100%;
    background:#0b0b0c;
    border-right:1px solid var(--border);
    padding:24px 16px;
    display:flex; 
    flex-direction:column; 
    gap:16px;
    transform: translateX(-100%); /* start hidden */
    transition: transform .25s ease;
    z-index: 50;

    overflow-y: auto;
    scrollbar-width: none; /* Firefox */
    -ms-overflow-style: none; /* IE/Edge */
  }
  .sidebar::-webkit-scrollbar {
    display: none; /* Chrome, Safari, Opera */
  }
  .sidebar.open { transform: translateX(0); }

  .brand{
    font-weight:800; font-size:28px;
    /* add: */
    background: var(--grad);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .menu{ display:flex; flex-direction:column; gap:8px }
  .menu-section{
    margin-top:8px; color:var(--muted); font-size:12px; text-transform:uppercase; letter-spacing:.12em;
  }
  .menu-item{
    padding:10px 12px; border-radius:10px; color:var(--text); text-decoration:none;
    border:1px solid transparent;
  }
  .menu-item:hover{ background:#141417; border-color:var(--border) }
  .menu-item.muted{ color:#b4b6bd }
  .menu-item.active{ background:#8400ff; border-color:var(--border) }
  .sidebar-foot{ margin-top:auto; font-size:12px; color:var(--muted); display:flex; align-items:center; gap:8px }
  .kbd{ border:1px solid var(--border); padding:2px 6px; border-radius:6px; background:#121214 }

  .menu-button {
    position: fixed;
    left: 15px;
    top: 15px;
  }
  .menu-button { z-index:49; background: transparent; border: 0; padding: 6px; }
  .menu-icon { background: transparent; display: block; width: 40px; height: 40px; }

  /* Sidebar should sit above overlays */
  .sidebar,
  #sidebar,              /* adjust to your real selector */
  .sidebar-container {   /* adjust */
    position: fixed;     /* important if it slides over content */
    top: 0;
    left: 0;
    height: 100vh;
    z-index: 9999;
  }

  /* Upgrade Button */
  .upgrade-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 10px 14px;
    margin: 8px 0 16px 0;
    border-radius: 10px;
    background: #0b0b0c;
    color: #e8e8ea;
    font-weight: 600;
    font-size: 13px;
    text-decoration: none;
    cursor: pointer;
    transition: all 0.25s ease;
    border: 2px solid transparent;
    background-image: linear-gradient(#0b0b0c, #0b0b0c), 
                      linear-gradient(90deg, #8400ff 0%, #f94016 40%, #f96d16 60%, #3b82f6 100%);
    background-origin: border-box;
    background-clip: padding-box, border-box;
    box-shadow: 0 0 12px rgba(132, 0, 255, 0.2), 
                0 0 24px rgba(249, 64, 22, 0.1);
  }

  .upgrade-btn:hover {
    transform: translateY(-1px);
    box-shadow: 0 0 16px rgba(132, 0, 255, 0.35), 
                0 0 32px rgba(249, 64, 22, 0.2),
                0 2px 12px rgba(0, 0, 0, 0.3);
  }

  .upgrade-icon {
    width: 16px;
    height: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .upgrade-icon svg {
    width: 14px;
    height: 14px;
    stroke: currentColor;
    stroke-width: 2;
  }

  /* Hide upgrade button for paid users */
  .upgrade-btn.hidden {
    display: none;
  }

  /* Subscription Badge Styles */
  .subscription-badge {
    display: none;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 10px 14px;
    margin: 8px 0 16px 0;
    border-radius: 10px;
    font-weight: 600;
    font-size: 13px;
    text-decoration: none;
    cursor: default;
    border: 2px solid transparent;
    background-origin: border-box;
    background-clip: padding-box, border-box;
  }

  .subscription-badge.visible {
    display: flex;
  }

  .subscription-badge.pro {
    background-image: linear-gradient(#0b0b0c, #0b0b0c), 
                      linear-gradient(135deg, #8400ff 0%, #a855f7 100%);
    color: #c084fc;
    box-shadow: 0 0 12px rgba(132, 0, 255, 0.25);
  }

  .subscription-badge.business {
    background-image: linear-gradient(#0b0b0c, #0b0b0c), 
                      linear-gradient(135deg, #f59e0b 0%, #fbbf24 100%);
    color: #fbbf24;
    box-shadow: 0 0 12px rgba(251, 191, 36, 0.25);
  }

  .badge-icon {
    width: 16px;
    height: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .badge-icon svg {
    width: 14px;
    height: 14px;
    fill: currentColor;
  }


</style>
