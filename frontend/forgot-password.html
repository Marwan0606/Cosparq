<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Forgot Password — CoSparq</title>
  <link rel="stylesheet" href="styles/auth.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet"/>
  <style>
    /* Additional styles for forgot password page */
    .forgot-container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0f0f10;
      padding: 20px;
    }
    
    .forgot-card {
      background: #191a1d;
      border-radius: 16px;
      padding: 48px 40px;
      max-width: 420px;
      width: 100%;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    
    .forgot-logo {
      text-align: center;
      margin-bottom: 32px;
    }
    
    .forgot-logo h1 {
      font-size: 28px;
      font-weight: 800;
      background: linear-gradient(90deg, #8400ff 0%, #f94016 40%, #f96d16 60%, #3b82f6 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    
    .forgot-title {
      color: #e8e8ea;
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 8px;
      text-align: center;
    }
    
    .forgot-subtitle {
      color: #a5a7ae;
      font-size: 14px;
      text-align: center;
      margin-bottom: 32px;
      line-height: 1.5;
    }
    
    .field {
      margin-bottom: 24px;
    }
    
    .field label {
      display: block;
      color: #e8e8ea;
      font-size: 14px;
      font-weight: 500;
      margin-bottom: 8px;
    }
    
    .field input {
      width: 100%;
      padding: 14px 16px;
      background: #0f0f10;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      color: #e8e8ea;
      font-size: 15px;
      transition: border-color 0.2s;
      box-sizing: border-box;
    }
    
    .field input:focus {
      outline: none;
      border-color: #8400ff;
    }
    
    .field input::placeholder {
      color: #6b6b75;
    }
    
    .btn-send {
      width: 100%;
      padding: 14px 24px;
      background: linear-gradient(90deg, #8400ff 0%, #f94016 40%, #f96d16 60%, #3b82f6 100%);
      border: none;
      border-radius: 50px;
      color: #fff;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    
    .btn-send:hover {
      filter: brightness(1.1);
    }
    
    .btn-send:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    
    .message {
      padding: 14px 16px;
      border-radius: 10px;
      font-size: 14px;
      margin-bottom: 20px;
      display: none;
    }
    
    .message.error {
      background: rgba(255, 74, 74, 0.1);
      border: 1px solid rgba(255, 74, 74, 0.3);
      color: #ff6b6b;
      display: block;
    }
    
    .message.success {
      background: rgba(34, 197, 94, 0.1);
      border: 1px solid rgba(34, 197, 94, 0.3);
      color: #22c55e;
      display: block;
    }
    
    .back-link {
      display: block;
      text-align: center;
      margin-top: 24px;
      color: #a5a7ae;
      font-size: 14px;
      text-decoration: none;
      transition: color 0.2s;
    }
    
    .back-link:hover {
      color: #e8e8ea;
    }
    
    /* Email sent state */
    .email-icon {
      width: 64px;
      height: 64px;
      background: linear-gradient(135deg, rgba(132, 0, 255, 0.1), rgba(249, 64, 22, 0.1));
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 24px;
    }
    
    .email-icon svg {
      color: #f94016;
    }
    
    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>
  <div class="forgot-container">
    <div class="forgot-card">
      <div class="forgot-logo">
        <h1>CoSparq</h1>
      </div>
      
      <!-- Request Form -->
      <div id="requestForm">
        <h2 class="forgot-title">Forgot Password?</h2>
        <p class="forgot-subtitle">No worries! Enter your email and we'll send you a link to reset your password.</p>
        
        <div id="messageBox" class="message"></div>
        
        <form id="forgotPasswordForm">
          <div class="field">
            <label for="email">Email Address</label>
            <input type="email" id="email" placeholder="you@example.com" required/>
          </div>
          
          <button type="submit" class="btn-send" id="sendBtn">Send Reset Link</button>
        </form>
      </div>
      
      <!-- Email Sent State -->
      <div id="sentState" class="hidden">
        <div class="email-icon">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
            <polyline points="22,6 12,13 2,6"/>
          </svg>
        </div>
        <h2 class="forgot-title">Check Your Email</h2>
        <p class="forgot-subtitle">If an account exists with that email, we've sent a password reset link. Check your inbox (and spam folder).</p>
        <a href="auth.html" class="btn-send" style="display: block; text-align: center; text-decoration: none;">Back to Login</a>
      </div>
      
      <a href="auth.html" class="back-link" id="backLink">← Back to Login</a>
    </div>
  </div>
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/axios/0.21.1/axios.min.js"></script>
  <script>
    const API_BASE = 'http://localhost:4004';
    
    const requestForm = document.getElementById('requestForm');
    const sentState = document.getElementById('sentState');
    const messageBox = document.getElementById('messageBox');
    const backLink = document.getElementById('backLink');
    
    // Handle form submission
    document.getElementById('forgotPasswordForm')?.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const email = document.getElementById('email').value;
      const sendBtn = document.getElementById('sendBtn');
      
      // Disable button
      sendBtn.disabled = true;
      sendBtn.textContent = 'Sending...';
      
      try {
        await axios.post(`${API_BASE}/forgot-password`, { email });
        
        // Always show success (security - don't reveal if email exists)
        requestForm.classList.add('hidden');
        sentState.classList.remove('hidden');
        backLink.classList.add('hidden');
        
      } catch (error) {
        // Even on error, show success (security)
        requestForm.classList.add('hidden');
        sentState.classList.remove('hidden');
        backLink.classList.add('hidden');
      }
    });
  </script>
</body>
</html>
