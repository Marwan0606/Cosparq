<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>The DNA — CoSparq</title>
  <link rel="stylesheet" href="styles/idea-page.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

  <!-- Animated Background -->
  <div class="background-gradient"></div>
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>

  <div id="sidebar-placeholder"></div>

  <div class="container">
    <!-- Header -->
    <header class="page-header">
      <h1 class="headline"><span class="gradient-text">The DNA</span></h1>
      <p class="subtitle">The more detail you provide, the smarter your AI becomes.</p>
    </header>

    <!-- Name + Completion Bar -->
    <div class="name-bar">
      <div class="name-bar-left">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20" style="color:var(--purple);flex-shrink:0;">
          <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
        </svg>
        <input class="name-input js-idea-name" placeholder="Name your idea..." />
      </div>
      <div class="completion-wrap">
        <span class="completion-label js-completion-label">0 / 8 sections</span>
        <div class="completion-bar"><div class="completion-fill js-completion-fill"></div></div>
      </div>
    </div>

    <!-- DNA Sections -->
    <div class="dna-content" id="dnaSections"></div>
  </div>

<script>
(function () {
  const LOGIN_URL = '/auth.html';
  if (location.pathname.endsWith('/auth.html')) return;
  const token = localStorage.getItem('accessToken');
  if (!token) return location.replace(LOGIN_URL);
})();
</script>



  <script
    src="https://cdnjs.cloudflare.com/ajax/libs/axios/0.21.1/axios.min.js"
    integrity="sha512-bZS47S7sPOxkjU/4Bt0zrhEtWx0y0CRkhEp8IckzK+ltifIIE9EMIMTuT/mEzoIMewUINruDBIR/jJnbguonqQ=="
    crossorigin="anonymous"
    referrerpolicy="no-referrer"
  ></script>
  <script src="./scripts/subscriptionHandler.js"></script>

  <script type="module">
    async function loadSidebar() {
      const res  = await fetch('sidebar.html');
      const html = await res.text();
      document.getElementById('sidebar-placeholder').innerHTML = html;
      const { initSidebar } = await import('./scripts/sidebar.js');
      await initSidebar();
    }
    loadSidebar();
  </script>

  <script type="module" src="./scripts/idea.js"></script>
</body>
