<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AI Co-Founder — CoSparq</title>
  <link rel="stylesheet" href="styles/cofounder-chat.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
</head>
<body>
  <!-- Background Effects -->
  <div class="background-effects">
    <div class="ambient-glow glow-1"></div>
    <div class="ambient-glow glow-2"></div>
  </div>

  <div id="sidebar-placeholder"></div>

  <main class="cofounder-main">
    <!-- Idle State - Before Call -->
    <div class="call-container idle-state" id="idleState">
      <div class="cofounder-header">
        <h1 class="cofounder-title">AI Co-Founder</h1>
        <p class="cofounder-subtitle">Your startup thinking partner</p>
      </div>

      <!-- 3D Orb Container -->
      <div id="orb-container" class="orb-container"></div>

      <!-- Status Indicator -->
      <div class="status-indicator" id="statusIndicator">
        <span class="status-dot"></span>
        <span class="status-text">Ready to chat</span>
      </div>

      <!-- Start Call Button -->
      <button class="start-call-btn" id="startCallBtn">
        <svg class="call-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/>
        </svg>
        <span>Start Meeting</span>
      </button>

      <!-- Recent Sessions -->
      <div class="recent-sessions" id="recentSessions">
        <h3 class="sessions-title">Recent Meetings</h3>
        <div class="sessions-list" id="sessionsList">
          <!-- Sessions loaded dynamically -->
        </div>
      </div>
    </div>

    <!-- Active Call State -->
    <div class="call-container active-state hidden" id="activeState">
      <!-- Call Header -->
      <div class="call-header">
        <div class="call-info">
          <span class="call-status">
            <span class="pulse-dot"></span>
            <span id="callStatusText">Connecting...</span>
          </span>
          <span class="call-timer" id="callTimer">00:00</span>
        </div>
      </div>

      <!-- Orb Container (Larger during call) -->
      <div id="orb-container-active" class="orb-container-active"></div>

      <!-- Live Transcript (Optional - can be hidden) -->
      <div class="transcript-container" id="transcriptContainer">
        <div class="transcript-toggle" id="transcriptToggle">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M4 6h16M4 12h16M4 18h16"/>
          </svg>
          <span>Transcript</span>
        </div>
        <div class="transcript-content hidden" id="transcriptContent">
          <div class="transcript-messages" id="transcriptMessages">
            <!-- Messages appear here -->
          </div>
        </div>
      </div>

      <!-- Call Controls -->
      <div class="call-controls">
        <button class="control-btn mute-btn" id="muteBtn" title="Mute">
          <svg class="unmuted-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
            <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
            <line x1="12" y1="19" x2="12" y2="23"/>
            <line x1="8" y1="23" x2="16" y2="23"/>
          </svg>
          <svg class="muted-icon hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="1" y1="1" x2="23" y2="23"/>
            <path d="M9 9v3a3 3 0 0 0 5.12 2.12M15 9.34V4a3 3 0 0 0-5.94-.6"/>
            <path d="M17 16.95A7 7 0 0 1 5 12v-2m14 0v2a7 7 0 0 1-.11 1.23"/>
            <line x1="12" y1="19" x2="12" y2="23"/>
            <line x1="8" y1="23" x2="16" y2="23"/>
          </svg>
        </button>

        <button class="control-btn end-call-btn" id="endCallBtn" title="End Call">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M10.68 13.31a16 16 0 0 0 3.41 2.6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7 2 2 0 0 1 1.72 2v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.42 19.42 0 0 1-3.33-2.67m-2.67-3.34a19.79 19.79 0 0 1-3.07-8.63A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91"/>
            <line x1="23" y1="1" x2="1" y2="23"/>
          </svg>
        </button>

        <button class="control-btn speaker-btn" id="speakerBtn" title="Speaker">
          <svg class="speaker-on-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
            <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/>
          </svg>
        </button>
      </div>
    </div>

    <!-- Summary State - After Call Ends -->
    <div class="call-container summary-state hidden" id="summaryState">
      <div class="summary-header">
        <h2 class="summary-title">Meeting Complete</h2>
        <p class="summary-subtitle">Generating your summary...</p>
      </div>

      <div class="summary-loading" id="summaryLoading">
        <div class="loading-orb"></div>
        <p>Analyzing meeting...</p>
      </div>

      <div class="summary-content hidden" id="summaryContent">
        <!-- Meeting Meta Info -->
        <div class="summary-meta">
          <span class="summary-date" id="summaryDate"></span>
          <span class="summary-duration" id="summaryDuration"></span>
        </div>

        <!-- Summary Board Grid -->
        <div class="summary-board">
          <!-- How Your Idea Stands Now - Full Width -->
          <div class="board-card full-width" id="ideaStandingCard">
            <h3 class="card-title">How Your Idea Stands Now</h3>
            <p class="card-content" id="ideaStandingContent"></p>
          </div>

          <!-- What We Discussed -->
          <div class="board-card" id="discussedCard">
            <h3 class="card-title">What we discussed</h3>
            <ul class="card-list" id="discussedList">
              <!-- Items populated by JS -->
            </ul>
          </div>

          <!-- Key Insights -->
          <div class="board-card" id="insightsCard">
            <h3 class="card-title">Key Insights</h3>
            <ul class="card-list insight-list" id="insightsList">
              <!-- Items populated by JS -->
            </ul>
          </div>

          <!-- What's New? -->
          <div class="board-card" id="whatsNewCard">
            <h3 class="card-title">What's New?</h3>
            <ul class="card-list new-list" id="whatsNewList">
              <!-- Items populated by JS -->
            </ul>
          </div>

          <!-- Next Steps -->
          <div class="board-card" id="nextStepsCard">
            <h3 class="card-title">Next Steps</h3>
            <ul class="card-list steps-list" id="nextStepsList">
              <!-- Items populated by JS -->
            </ul>
          </div>
        </div>
      </div>

      <div class="summary-actions hidden" id="summaryActions">
        <button class="action-btn back-btn" id="backToIdleBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18">
            <path d="M19 12H5M12 19l-7-7 7-7"/>
          </svg>
          Back
        </button>
        <button class="action-btn primary" id="emailSummary">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18">
            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
            <polyline points="22,6 12,13 2,6"/>
          </svg>
          Email Summary
        </button>
        <button class="action-btn secondary" id="startNewCall">
          Start New Meeting
        </button>
        <button class="action-btn delete-btn" id="deleteMeetingBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18">
            <polyline points="3 6 5 6 21 6"/>
            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
            <line x1="10" y1="11" x2="10" y2="17"/>
            <line x1="14" y1="11" x2="14" y2="17"/>
          </svg>
          Delete
        </button>
      </div>
    </div>
  </main>

  <!-- Three.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  
  <!-- Axios for API calls -->
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  
  <!-- Load Sidebar -->
  <script>
    async function loadSidebar() {
      const res = await fetch('sidebar.html');
      const html = await res.text();
      document.getElementById('sidebar-placeholder').innerHTML = html;
      // Import the sidebar module properly
      const { initSidebar } = await import('./scripts/sidebar.js');
      await initSidebar();
    }
    loadSidebar();
  </script>
  
  <!-- Orb Component -->
  <script src="scripts/cofounder-orb.js"></script>
  
  <!-- Voice Manager -->
  <script src="scripts/voice-manager.js"></script>
  
  <!-- Page Script -->
  <script src="scripts/cofounder-chat.js"></script>
</body>
</html>
