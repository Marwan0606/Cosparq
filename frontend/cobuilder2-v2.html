<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CoBuilder 2 — CoSparq</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg-deep: #0a0a0b;
      --bg-surface: #161618;
      --bg-elevated: #111113;
      --bg-input: #1a1a1a;
      --border: rgba(255,255,255,0.06);
      --border-hover: rgba(255,255,255,0.12);
      --text-primary: #e8e8ea;
      --text-secondary: #a1a1aa;
      --text-dim: #6b6b6b;
      --accent: #8400ff;
      --grad: linear-gradient(90deg, #8400ff 0%, #f94016 40%, #f96d16 60%, #3b82f6 100%);
      --grad-cta: linear-gradient(90deg, #8400ff, #ba0186, #f94016, #f96d16);
      --grad-subtle: linear-gradient(135deg, rgba(132,0,255,0.15), rgba(249,64,22,0.15), rgba(59,130,246,0.15));
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --radius-xl: 24px;
      --radius-pill: 9999px;
      --shadow: 0 8px 24px rgba(0,0,0,0.5);
      --transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      -webkit-font-smoothing: antialiased;
      background: var(--bg-deep);
      color: var(--text-primary);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ─── AMBIENT ORBS ─── */
    .orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(120px);
      opacity: 0.25;
      pointer-events: none;
      z-index: 0;
    }
    .orb-1 { width: 500px; height: 500px; background: #8400ff; top: -150px; left: -100px; animation: float1 12s ease-in-out infinite; }
    .orb-2 { width: 400px; height: 400px; background: #f94016; bottom: -100px; right: -80px; animation: float2 15s ease-in-out infinite; }
    .orb-3 { width: 300px; height: 300px; background: #3b82f6; top: 50%; left: 50%; animation: float3 10s ease-in-out infinite; }

    @keyframes float1 { 0%,100% { transform: translate(0,0); } 50% { transform: translate(40px,30px); } }
    @keyframes float2 { 0%,100% { transform: translate(0,0); } 50% { transform: translate(-30px,-40px); } }
    @keyframes float3 { 0%,100% { transform: translate(-50%,-50%); } 50% { transform: translate(-40%,-40%); } }

    /* ─── LAYOUT ─── */
    .main-content {
      position: relative;
      z-index: 1;
      padding: 32px 32px 32px 80px;
      max-width: 1100px;
      margin: 0 auto;
    }

    /* ─── HEADER ─── */
    .page-header {
      text-align: center;
      margin-bottom: 36px;
    }
    .page-header h1 {
      font-size: clamp(2.5rem, 4vw, 3.5rem);
      font-weight: 800;
      background: var(--grad);
      -webkit-background-clip: text;
      color: transparent;
      letter-spacing: -0.03em;
      line-height: 1.1;
    }
    .page-header p {
      color: var(--text-secondary);
      font-size: 1rem;
      margin-top: 8px;
    }

    /* ─── IDEA CARD ─── */
    .idea-card {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 20px 24px;
      margin-bottom: 24px;
      position: relative;
      overflow: hidden;
    }
    .idea-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
      background: var(--grad);
    }
    .idea-card-label {
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--text-dim);
      margin-bottom: 8px;
    }
    .idea-card-name {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 6px;
    }
    .idea-card-text {
      font-size: 0.88rem;
      color: var(--text-secondary);
      line-height: 1.5;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .idea-card-empty {
      color: var(--text-dim);
      font-style: italic;
    }

    /* ─── SETUP PANEL ─── */
    .setup-panel {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-xl);
      padding: 28px;
      margin-bottom: 28px;
    }
    .setup-section {
      margin-bottom: 24px;
    }
    .setup-section:last-child { margin-bottom: 0; }
    .setup-label {
      font-size: 0.8rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-secondary);
      margin-bottom: 12px;
    }

    /* Color palette picker */
    .palette-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }
    .palette-btn {
      width: 52px;
      height: 52px;
      border-radius: var(--radius-md);
      border: 2px solid transparent;
      cursor: pointer;
      transition: var(--transition);
      position: relative;
      overflow: hidden;
    }
    .palette-btn:hover { transform: translateY(-2px); border-color: rgba(255,255,255,0.2); }
    .palette-btn.active { border-color: #fff; box-shadow: 0 0 16px rgba(132,0,255,0.4); }
    .palette-btn .swatch {
      width: 100%; height: 100%;
      display: flex;
    }
    .palette-btn .swatch span {
      flex: 1;
    }

    /* Style pills */
    .style-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }
    .style-pill {
      padding: 8px 20px;
      border-radius: var(--radius-pill);
      border: 1px solid var(--border);
      background: var(--bg-elevated);
      color: var(--text-secondary);
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      transition: var(--transition);
    }
    .style-pill:hover { border-color: rgba(132,0,255,0.3); color: var(--text-primary); }
    .style-pill.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    /* Text area */
    .custom-textarea {
      width: 100%;
      min-height: 80px;
      background: var(--bg-input);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: var(--radius-md);
      color: var(--text-primary);
      font-family: inherit;
      font-size: 0.9rem;
      padding: 14px;
      resize: vertical;
      transition: var(--transition);
    }
    .custom-textarea:focus {
      outline: none;
      border-color: var(--accent);
    }
    .custom-textarea::placeholder { color: var(--text-dim); }

    /* Generate button */
    .generate-btn {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: var(--radius-md);
      background: var(--grad-cta);
      color: #fff;
      font-family: inherit;
      font-size: 1.05rem;
      font-weight: 700;
      cursor: pointer;
      transition: var(--transition);
      position: relative;
      overflow: hidden;
    }
    .generate-btn::before {
      content: '';
      position: absolute;
      inset: 0;
      background: var(--grad-cta);
      filter: blur(18px);
      opacity: 0.4;
      z-index: -1;
      transition: var(--transition);
    }
    .generate-btn:hover { transform: translateY(-2px); }
    .generate-btn:hover::before { opacity: 0.7; filter: blur(24px); }
    .generate-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    /* ─── LOADING OVERLAY ─── */
    .loading-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(10,10,11,0.92);
      z-index: 100;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
    }
    .loading-overlay.active { display: flex; }

    .loading-spinner {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      border: 3px solid rgba(255,255,255,0.1);
      border-top-color: #8400ff;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .loading-text {
      font-size: 1.1rem;
      font-weight: 600;
      background: var(--grad);
      -webkit-background-clip: text;
      color: transparent;
      animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.5; } }

    /* ─── PREVIEW STATE ─── */
    .preview-container {
      display: none;
    }
    .preview-container.active { display: block; }

    /* Version timeline */
    .version-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px 20px;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      margin-bottom: 16px;
      overflow-x: auto;
      scrollbar-width: thin;
      scrollbar-color: rgba(255,255,255,0.1) transparent;
    }
    .version-bar::-webkit-scrollbar { height: 4px; }
    .version-bar::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 2px; }

    .version-label {
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--text-dim);
      white-space: nowrap;
      margin-right: 4px;
    }

    .version-chip {
      padding: 4px 12px;
      border-radius: var(--radius-pill);
      border: 1px solid var(--border);
      background: var(--bg-elevated);
      color: var(--text-secondary);
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: var(--transition);
      flex-shrink: 0;
    }
    .version-chip:hover { border-color: rgba(132,0,255,0.4); color: var(--text-primary); }
    .version-chip.active {
      background: var(--grad-cta);
      border-color: transparent;
      color: #fff;
    }
    .version-chip-desc {
      display: none;
      position: absolute;
      bottom: calc(100% + 6px);
      left: 50%;
      transform: translateX(-50%);
      padding: 6px 10px;
      background: #222;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      font-size: 0.72rem;
      color: var(--text-secondary);
      white-space: nowrap;
      max-width: 200px;
      overflow: hidden;
      text-overflow: ellipsis;
      z-index: 10;
    }
    .version-chip-wrap {
      position: relative;
      flex-shrink: 0;
    }
    .version-chip-wrap:hover .version-chip-desc { display: block; }

    .version-nav-btn {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: var(--bg-elevated);
      color: var(--text-secondary);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.8rem;
      transition: var(--transition);
      flex-shrink: 0;
    }
    .version-nav-btn:hover { border-color: var(--accent); color: var(--text-primary); }

    /* Iframe preview */
    .preview-frame-wrap {
      border-radius: var(--radius-lg);
      overflow: hidden;
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      background: #fff;
      margin-bottom: 16px;
    }
    .preview-frame-wrap iframe {
      width: 100%;
      height: 600px;
      border: none;
      display: block;
    }

    /* Action buttons */
    .preview-actions {
      display: flex;
      gap: 10px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }
    .action-btn {
      padding: 10px 20px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: var(--bg-elevated);
      color: var(--text-secondary);
      font-family: inherit;
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      transition: var(--transition);
    }
    .action-btn:hover { border-color: rgba(132,0,255,0.3); color: var(--text-primary); }

    /* Edit bar */
    .edit-bar {
      display: flex;
      gap: 12px;
      align-items: stretch;
    }
    .edit-input {
      flex: 1;
      padding: 14px 18px;
      background: var(--bg-input);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: var(--radius-md);
      color: var(--text-primary);
      font-family: inherit;
      font-size: 0.9rem;
      transition: var(--transition);
    }
    .edit-input:focus { outline: none; border-color: var(--accent); }
    .edit-input::placeholder { color: var(--text-dim); }

    .edit-btn {
      padding: 14px 28px;
      border: none;
      border-radius: var(--radius-md);
      background: var(--grad-cta);
      color: #fff;
      font-family: inherit;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition);
      white-space: nowrap;
    }
    .edit-btn:hover { opacity: 0.85; transform: translateY(-1px); }
    .edit-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

    /* ─── SETUP HIDDEN STATE ─── */
    .setup-panel.hidden { display: none; }

    /* ─── RESPONSIVE ─── */
    @media (max-width: 768px) {
      .main-content { padding: 20px 16px 20px 16px; }
      .preview-frame-wrap iframe { height: 450px; }
      .edit-bar { flex-direction: column; }
    }

    /* ─── TOAST ─── */
    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      padding: 12px 20px;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      color: var(--text-primary);
      font-size: 0.85rem;
      font-weight: 500;
      z-index: 200;
      opacity: 0;
      transform: translateY(10px);
      transition: var(--transition);
      pointer-events: none;
    }
    .toast.show { opacity: 1; transform: translateY(0); pointer-events: auto; }

    /* ─── WAITLIST MODAL ─── */
    .waitlist-modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.7);
      backdrop-filter: blur(6px);
      z-index: 300;
      display: none;
      align-items: center;
      justify-content: center;
    }
    .waitlist-modal-overlay.active { display: flex; }
    .waitlist-modal {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      width: 90%;
      max-width: 700px;
      max-height: 80vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 24px 60px rgba(0,0,0,0.6);
    }
    .waitlist-modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 24px;
      border-bottom: 1px solid var(--border);
    }
    .waitlist-modal-header h2 {
      font-size: 1.2rem;
      font-weight: 700;
      background: var(--grad);
      -webkit-background-clip: text;
      color: transparent;
    }
    .waitlist-close {
      background: none;
      border: none;
      color: var(--text-secondary);
      font-size: 1.6rem;
      cursor: pointer;
      line-height: 1;
      padding: 4px 8px;
    }
    .waitlist-close:hover { color: var(--text-primary); }
    .waitlist-count {
      padding: 12px 24px;
      font-size: 0.9rem;
      color: var(--text-secondary);
      font-weight: 600;
    }
    .waitlist-table-wrap {
      flex: 1;
      overflow-y: auto;
      padding: 0 24px;
    }
    .waitlist-table {
      width: 100%;
      border-collapse: collapse;
    }
    .waitlist-table th {
      text-align: left;
      padding: 10px 12px;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-dim);
      border-bottom: 1px solid var(--border);
    }
    .waitlist-table td {
      padding: 10px 12px;
      font-size: 0.85rem;
      color: var(--text-primary);
      border-bottom: 1px solid var(--border);
    }
    .waitlist-table tr:last-child td { border-bottom: none; }
    .waitlist-empty {
      text-align: center;
      padding: 40px 20px;
      color: var(--text-dim);
      font-size: 0.9rem;
    }
    .waitlist-actions {
      padding: 16px 24px;
      border-top: 1px solid var(--border);
      display: flex;
      gap: 10px;
    }
  </style>
</head>
<body>

  <!-- Ambient orbs -->
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>

  <!-- Sidebar placeholder -->
  <div id="sidebar-placeholder"></div>

  <!-- Loading overlay -->
  <div class="loading-overlay" id="loadingOverlay">
    <div class="loading-spinner"></div>
    <div class="loading-text" id="loadingText">Building your landing page...</div>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <!-- Waitlist Modal -->
  <div class="waitlist-modal-overlay" id="waitlistOverlay">
    <div class="waitlist-modal">
      <div class="waitlist-modal-header">
        <h2>Waitlist Signups</h2>
        <button class="waitlist-close" id="waitlistClose">&times;</button>
      </div>
      <div class="waitlist-count" id="waitlistCount">0 signups</div>
      <div class="waitlist-table-wrap">
        <table class="waitlist-table" id="waitlistTable">
          <thead>
            <tr><th>Name</th><th>Email</th><th>Signed Up</th></tr>
          </thead>
          <tbody id="waitlistBody"></tbody>
        </table>
        <div class="waitlist-empty" id="waitlistEmpty" style="display:none;">No signups yet. Share your landing page!</div>
      </div>
      <div class="waitlist-actions">
        <button class="action-btn" id="btnExportCSV">Export CSV</button>
      </div>
    </div>
  </div>

  <div class="main-content">
    <!-- Header -->
    <div class="page-header">
      <h1>CoBuilder 2</h1>
      <p>Generate stunning landing pages for your startup idea with AI</p>
    </div>

    <!-- Idea Card -->
    <div class="idea-card" id="ideaCard">
      <div class="idea-card-label">Building for</div>
      <div class="idea-card-name" id="ideaName">Loading idea...</div>
      <div class="idea-card-text" id="ideaText"></div>
    </div>

    <!-- Setup Panel (pre-generation) -->
    <div class="setup-panel" id="setupPanel">
      <!-- Color Scheme -->
      <div class="setup-section">
        <div class="setup-label">Color Scheme</div>
        <div class="palette-grid" id="paletteGrid">
          <!-- Palettes injected by JS -->
        </div>
      </div>

      <!-- Style -->
      <div class="setup-section">
        <div class="setup-label">Visual Style</div>
        <div class="style-pills" id="stylePills">
          <button class="style-pill" data-style="minimal">Minimal</button>
          <button class="style-pill" data-style="bold">Bold</button>
          <button class="style-pill" data-style="corporate">Corporate</button>
          <button class="style-pill" data-style="playful">Playful</button>
          <button class="style-pill" data-style="dark-premium">Dark Premium</button>
          <button class="style-pill" data-style="gradient-modern">Gradient Modern</button>
        </div>
      </div>

      <!-- Additional instructions -->
      <div class="setup-section">
        <div class="setup-label">Additional Instructions (optional)</div>
        <textarea class="custom-textarea" id="additionalInput" placeholder="e.g., Add a testimonials section, make it feel like a YC startup, include pricing cards..."></textarea>
      </div>

      <!-- Generate button -->
      <button class="generate-btn" id="generateBtn">Generate Landing Page</button>
    </div>

    <!-- Preview container (post-generation) -->
    <div class="preview-container" id="previewContainer">
      <!-- Version bar -->
      <div class="version-bar" id="versionBar">
        <span class="version-label">Versions</span>
        <button class="version-nav-btn" id="versionPrev" title="Previous version">&#8249;</button>
        <div id="versionChips" style="display:flex;gap:6px;overflow-x:auto;flex:1;"></div>
        <button class="version-nav-btn" id="versionNext" title="Next version">&#8250;</button>
      </div>

      <!-- Preview iframe -->
      <div class="preview-frame-wrap">
        <iframe id="previewIframe" sandbox="allow-scripts allow-same-origin"></iframe>
      </div>

      <!-- Action buttons -->
      <div class="preview-actions">
        <button class="action-btn" id="btnFullPreview">Full Page Preview</button>
        <button class="action-btn" id="btnCopyCode">Copy HTML</button>
        <button class="action-btn" id="btnDownload">Download HTML</button>
        <button class="action-btn" id="btnViewWaitlist">View Waitlist</button>
        <button class="action-btn" id="btnNewPage">New Design</button>
      </div>

      <!-- Edit bar -->
      <div class="edit-bar">
        <input type="text" class="edit-input" id="editInput" placeholder="Describe changes — e.g., Make the hero section darker, add a FAQ section...">
        <button class="edit-btn" id="editBtn">Apply Changes</button>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script
    src="https://cdnjs.cloudflare.com/ajax/libs/axios/0.21.1/axios.min.js"
    integrity="sha512-bZS47S7sPOxkjU/4Bt0zrhEtWx0y0CRkhEp8IckzK+ltifIIE9EMIMTuT/mEzoIMewUINruDBIR/jJnbguonqQ=="
    crossorigin="anonymous"
    referrerpolicy="no-referrer"
  ></script>
  <script src="/scripts/apiLimitHandler.js"></script>
  <script src="/scripts/subscriptionHandler.js"></script>
  <script>
    // Load sidebar (must match pattern used by all other pages)
    async function loadSidebar() {
      const res = await fetch('/sidebar.html');
      const html = await res.text();
      document.getElementById('sidebar-placeholder').innerHTML = html;

      const { initSidebar } = await import('./scripts/sidebar.js');
      await initSidebar();

      // Highlight current page
      document.querySelectorAll('.menu-item').forEach(item => {
        if (item.getAttribute('href') === '/cobuilder2-v2.html') {
          item.classList.add('active');
        }
      });
    }
    loadSidebar();
  </script>
  <script type="module" src="/scripts/cobuilder2v2.js"></script>
</body>
</html>
