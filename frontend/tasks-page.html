<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Team Task</title>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles/tasks-page.css"/>
</head>
<body>
  <div id="sidebar-placeholder"></div>
  <main class="container">
    <header class="hero">
      <h1 class="title">Task <span>Manager</span></h1>
      <p class="tagline js-workspace-name"></p>
    </header>

    <!-- Minimal composer -->
    <section class="composer" aria-label="Add a new task">
      <div class="composer__surface" id="composerSurface">
        <input id="titleInput" class="input js-input-task" type="text"
               placeholder="Create a task here"
               autocomplete="off" aria-label="Task title"/>
        <button id="aiTaskBtn" class="composer__btn">
          TasksAi
        </button>
        <button id="postBtn" class="composer__btn"
                aria-haspopup="dialog" aria-expanded="false" aria-controls="detailsPopover">
          Post
        </button>

        <!-- Popover (opens under the Post button) -->
        <form id="detailsPopover" class="popover" role="dialog" hidden>
          <h3 id="popTitle">Add details</h3>
          <div class="pop-grid">
            <label class="field">
              <span>Assignee</span>
              <input id="assigneeInput" type="text" placeholder="e.g., Alex"/>
            </label>
            <label class="field">
              <span>Urgency</span>
              <select id="urgencySelect">
                <option value="" disabled selected hidden>Select urgency</option>
                <option value="Low">Low</option>
                <option value="Medium">Medium</option>
                <option value="High">High</option>
              </select>
            </label>
            <label class="field">
              <span>Deadline</span>
              <input id="dueInput" type="date"/>
            </label>
          </div>
          <label class="field">
            <span>Description</span>
            <textarea id="description-text" class="description-text"></textarea>
          </label>
          <div class="actions">
            <button type="button" id="cancelBtn" class="btn ghost">Cancel</button>
            <button type="submit" id="submitTaskBtn" class="btn primary">Add task</button>
          </div>
          <div class="caret"></div>
        </form>


        
      </div>
      <p id="hint" class="hint" role="status" aria-live="polite"></p>
    </section>



    <!-- Task list -->
    <div class="js-task-list task-list">
      <!-- Empty state -->
      <section id="emptyCard" class="card empty" aria-hidden="false">
        <h3>No tasks yet</h3>
        <p>Add your first task above to get started</p>
      </section>
    </div>
    
  </main>

  <!-- Task template -->
  <template id="itemTpl">
    <li class="task" role="listitem">
      <button class="task__check" aria-label="Toggle complete" aria-pressed="false"></button>
      <div class="task__content">
        <div class="task__title"></div>
        <div class="task__meta">
          <span class="badge badge--urgency" data-u="M">Medium</span>
          <span class="dot">•</span>
          <span class="badge badge--assignee">Unassigned</span>
          <span class="dot">•</span>
          <span class="badge badge--due">No deadline</span>
        </div>
      </div>
      <button class="task__delete" aria-label="Delete task">✕</button>
    </li>
  </template>


  <div id="popupOverlay2">
    <div id="popupBox2">
      <h2 class="topic-text2">Your AI Generated Tasks</h2>
      <div class="explain-container2">
        <h3 class="explain-text2">Type whatever you want to implement in your app and your CoSparq will give you step by step tasks. CoSparq is context aware and already knows everything about your idea</h3>
      </div>
      <textarea type="text" id="popupInput2" class="popupInput2" placeholder="Type here"></textarea>
      <br><br>
      <button id='confirmBtn2' class="confirm-button2">Confirm</button>
    </div>
  </div>

  <script
    src="https://cdnjs.cloudflare.com/ajax/libs/axios/0.21.1/axios.min.js"
    integrity="sha512-bZS47S7sPOxkjU/4Bt0zrhEtWx0y0CRkhEp8IckzK+ltifIIE9EMIMTuT/mEzoIMewUINruDBIR/jJnbguonqQ=="
    crossorigin="anonymous"
    referrerpolicy="no-referrer"
  ></script>
  <script src="./scripts/apiLimitHandler.js"></script>
  <script src="./scripts/subscriptionHandler.js"></script>
  <script src="scripts/tasks-page.js" defer></script>

  <script>
  (function () {
    const LOGIN_URL = '/auth.html';

    // If you're already on auth.html, do nothing
    if (location.pathname.endsWith('/auth.html')) return;

    const token = localStorage.getItem('accessToken');
    if (!token) {
      // Not logged in (no token) → redirect
      return location.replace(LOGIN_URL);
    }

    // Optionally: verify expiry client-side with jwt-decode or
    // ping a /token/verify endpoint. Otherwise, just let the
    // axios interceptor handle 401s server-side.
  })();

  </script>


  <script type="module">
  async function loadSidebar() {
    const res  = await fetch('sidebar.html');
    const html = await res.text();
    document.getElementById('sidebar-placeholder').innerHTML = html;

    const { initSidebar } = await import('./scripts/sidebar.js');
    await initSidebar();
  }
  loadSidebar();

  </script>

  
</body>
</html>
